name: Close Stale Issues
on:
  schedule:
    - cron: "0 0 * * 1"
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has had no activity for 30 days. It will be closed in 7 days
            unless you update it with new information.
          close-issue-message: >
            Closing this issue due to inactivity. If the problem still occurs,
            feel free to reopen it with fresh details — the shared infrastructure
            may have already been updated since.
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          exempt-issue-labels: "bug,enhancement,pinned"