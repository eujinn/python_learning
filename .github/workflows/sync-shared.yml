name: Sync shared infrastructure

on:
  push:

jobs:
  # Case 1: shared files changed on a non-main branch → create/update PR to main
  sync-to-main:
    if: github.ref_name != 'main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for shared file changes
        id: check
        run: |
          SHARED="core/ css/ scripts/ index.html assets/"
          MERGE_BASE=$(git merge-base HEAD origin/main)
          CHANGED=$(git diff --name-only "$MERGE_BASE" HEAD -- $SHARED)
          if [ -n "$CHANGED" ]; then
            echo "has_shared=true" >> $GITHUB_OUTPUT
            echo "$CHANGED" > /tmp/changed-files.txt
          else
            echo "has_shared=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update sync PR to main
        if: steps.check.outputs.has_shared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          BR="sync/${{ github.ref_name }}/shared"
          TITLE="Sync shared files from ${{ github.ref_name }} to main"

          EXISTING=$(gh pr list --repo "$REPO" --base main --head "$BR" --json number --jq '.[0].number' 2>/dev/null || echo "")

          git fetch origin main
          git checkout -b "$BR" origin/main 2>/dev/null || git checkout "$BR"
          git rm -rq --ignore-unmatch -f core/ css/ scripts/ index.html assets/ 2>/dev/null || true
          git checkout "${{ github.ref_name }}" -- core/ css/ scripts/ index.html assets/
          git add core/ css/ scripts/ index.html assets/

          if git diff --cached --quiet; then
            echo "No changes to sync (shared files are identical to main)"
            exit 0
          fi

          git commit -m "sync shared infrastructure from ${{ github.ref_name }}"
          git push --force origin "$BR"

          printf '%s\n' \
            "Automated sync of shared infrastructure changes from \`${{ github.ref_name }}\`." \
            "" \
            "**Modified shared files:**" \
            '```' > /tmp/pr-body.md
          cat /tmp/changed-files.txt >> /tmp/pr-body.md
          printf '%s\n' \
            '```' \
            "" \
            "After merging, rebase module branches on \`main\`:" \
            '```' \
            "git rebase main" \
            '```' >> /tmp/pr-body.md

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$BR" \
              --title "$TITLE" \
              --body-file /tmp/pr-body.md
          else
            gh pr edit "$EXISTING" \
              --repo "$REPO" \
              --title "$TITLE" \
              --body-file /tmp/pr-body.md
          fi

  # Case 2: shared files changed on main → create/update PRs to every module/* branch
  sync-from-main:
    if: github.ref_name == 'main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for shared file changes against previous commit
        id: check
        run: |
          SHARED="core/ css/ scripts/ index.html assets/"
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- $SHARED 2>/dev/null)
          if [ -n "$CHANGED" ]; then
            echo "has_shared=true" >> $GITHUB_OUTPUT
            echo "$CHANGED" > /tmp/changed-files.txt
          else
            echo "has_shared=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync to every module branch
        if: steps.check.outputs.has_shared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"

          gh api "repos/$REPO/branches" --paginate --jq '.[] | select(.name | startswith("module/")) | .name' > /tmp/module-branches.txt

          while IFS= read -r MOD_BRANCH; do
            [ -z "$MOD_BRANCH" ] && continue
            echo "::group::Sync to $MOD_BRANCH"

            git fetch origin "$MOD_BRANCH"
            TITLE="Sync shared infrastructure from main"
            BR="sync/main-to-$MOD_BRANCH"

            EXISTING=$(gh pr list --repo "$REPO" --base "$MOD_BRANCH" --head "$BR" --json number --jq '.[0].number' 2>/dev/null || echo "")

            git checkout -b "$BR" "origin/$MOD_BRANCH" 2>/dev/null || git checkout "$BR" 2>/dev/null
            git rm -rq --ignore-unmatch -f core/ css/ scripts/ index.html assets/ 2>/dev/null || true
            git checkout origin/main -- core/ css/ scripts/ index.html assets/
            git add core/ css/ scripts/ index.html assets/

            if git diff --cached --quiet; then
              echo "No shared changes needed"
              git checkout origin/main
              echo "::endgroup::"
              continue
            fi

            git commit -m "sync shared infrastructure from main"
            git push --force origin "$BR"

            printf '%s\n' \
              "Automated sync of shared infrastructure from \`main\` to \`$MOD_BRANCH\`." \
              "" \
              "**Changed shared files:**" \
              '```' > /tmp/pr-body.md
            cat /tmp/changed-files.txt >> /tmp/pr-body.md
            printf '%s\n' \
              '```' \
              "" \
              "After merging, run:" \
              '```' \
              "git rebase main" \
              '```' >> /tmp/pr-body.md

            if [ -z "$EXISTING" ]; then
              gh pr create --repo "$REPO" --base "$MOD_BRANCH" --head "$BR" --title "$TITLE" --body-file /tmp/pr-body.md
              echo "PR created"
            else
              gh pr edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file /tmp/pr-body.md
              echo "PR #$EXISTING updated"
            fi

            git checkout origin/main
            echo "::endgroup::"
          done < /tmp/module-branches.txt